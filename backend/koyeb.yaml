name: qa-manager-backend
services:
  - name: api
    type: web
    git:
      repository: github.com/helenajbarros/qa-manager
      branch: main
      buildpack: nodejs
      build_command: "cd backend && npm install"
      run_command: "cd backend && node src/server.js"
    ports:
      - port: 3001
        protocol: http
    env:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
    health_checks:
      - path: /api/health
        port: 3001
