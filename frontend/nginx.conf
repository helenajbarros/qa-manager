server {
  listen 80;
  server_name _;

  # o contêiner escuta na 80 e o Docker publica na 8080: sem isso o redirecionamento perde a porta (localhost → conexão recusada)
  absolute_redirect off;

  # Redireciona a raiz para o caminho base da aplicação
  location = / {
    return 301 /qa-manager/;
  }

  # Arquivos estáticos do build do Vite (base: "/qa-manager/")
  location /qa-manager/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /qa-manager/index.html;
  }

  # Proxy da API para o container do backend
  location /api/ {
    proxy_pass http://backend:3001/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Proxy dos arquivos de evidência enviados (uploads)
  location /uploads/ {
    proxy_pass http://backend:3001/uploads/;
  }
}
